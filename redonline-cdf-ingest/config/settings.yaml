# Pipeline settings — HSE Compliance → Cognite RAW (ROL-COR)
# First wave: RAW staging only (data model load disabled until views are confirmed)

cognite:
  project: celanese
  cluster: az-eastus-1
  base_url: https://az-eastus-1.cognitedata.com

raw:
  database: ROL-COR
  tables:
    Sites: Sites
    Users: Users
    User_profiles: User_profiles
    Tasks: Tasks
    Task_instances: Task_instances
    Task_occurrences: Task_occurrences
    Ref_categories: Ref_categories
    Ref_priorities: Ref_priorities
    Ref_states: Ref_states
    Ref_occurrence_statuses: Ref_occurrence_statuses
    Ingestion_state: Ingestion_state

# First ingestion targets Cognite RAW only
load_to_data_model: false

# Cascaded walk: sites → users(site) → tasks(user) → references(once)
ingest_mode: cascaded
cascaded:
  # Set integers to limit volume during testing; null = no limit
  max_sites: null
  max_users_per_site: null
  max_users_for_tasks: null

data_model:
  instance_space: ac_action_item_management
  views:
    site:
      space: ac_action_item_management
      external_id: Site
      version: "1"
    user:
      space: ac_action_item_management
      external_id: User
      version: "1"
    task:
      space: ac_action_item_management
      external_id: Task
      version: "1"

batch:
  raw_upsert_size: 10000
  dm_apply_size: 1000

schedule:
  suggested_cron: "0 */6 * * *"
