# Pipeline settings — HSE Compliance → Cognite Action Item Management

raw:
  database: redonline_staging
  tables:
    sites: sites
    users: users
    references: references
    tasks: tasks
    ingestion_state: ingestion_state

data_model:
  # Existing Action Item Management solution space / views in CDF
  # Update external_id / version to match the live model
  instance_space: ac_action_item_management
  views:
    site:
      space: ac_action_item_management
      external_id: Site
      version: "1"
    user:
      space: ac_action_item_management
      external_id: User
      version: "1"
    reference:
      space: ac_action_item_management
      external_id: Reference
      version: "1"
    task:
      space: ac_action_item_management
      external_id: Task
      version: "1"

entities:
  - name: sites
    endpoint: list_sites
    raw_table: sites
    view_key: site
    id_field: id
    watermark_field: updatedAt
  - name: users
    endpoint: list_users_by_site
    raw_table: users
    view_key: user
    id_field: id
    watermark_field: updatedAt
  - name: references
    endpoint: list_mapping_references
    raw_table: references
    view_key: reference
    id_field: id
    watermark_field: updatedAt
  - name: tasks
    endpoint: list_tasks_by_user
    raw_table: tasks
    view_key: task
    id_field: id
    watermark_field: updatedAt

batch:
  raw_upsert_size: 10000
  dm_apply_size: 1000

schedule:
  # Informational only — configure cron on Cognite Function or Windows Task Scheduler
  suggested_cron: "0 */6 * * *"
