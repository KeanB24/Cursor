# Map staged RAW columns → Cognite DM view properties (used when load_to_data_model: true).
# First wave stages RAW only; keep these aligned for a later DM load.

site:
  externalId: id_site
  properties:
    name: name
    idParent: id_parent
    idSiteType: id_site_type
    idCountry: id_country
    idRefStatus: id_ref_status
    codeIso: code_iso
    countryName: country_name
    sourceSystem: _source_system

user:
  externalId: id_user
  properties:
    firstName: firstname
    lastName: lastname
    userName: user_name
    email: email
    language: language
    locale: locale
    idSite: id_site
    idClient: id_client
    idRefStatus: id_ref_status
    sourceSystem: _source_system

task:
  externalId: id
  properties:
    title: title
    description: description
    typeId: type_id
    category: category
    priority: priority
    state: state
    scope: scope
    criticality: criticality
    temporalCriticality: temporal_criticality
    dueScheduledAt: due_scheduled_at
    createdAt: created_at
    updatedAt: updated_at
    sourceSystem: _source_system

constants:
  _source_system: ROL
