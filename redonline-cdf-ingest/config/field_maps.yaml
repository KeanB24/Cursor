# Map HSE / RAW columns → Cognite Data Model view properties.
# Placeholder field names until discover_rol_schema.py + live CDF views confirm them.
# After discovery: align keys with samples/rol/schema_summary.md and view properties.

site:
  externalId: id
  properties:
    name: name
    code: code
    updatedAt: updatedAt
    sourceSystem: _source_system

user:
  externalId: id
  properties:
    name: name
    email: email
    siteId: siteId
    updatedAt: updatedAt
    sourceSystem: _source_system

reference:
  externalId: id
  properties:
    label: label
    code: code
    userId: userId
    updatedAt: updatedAt
    sourceSystem: _source_system

task:
  externalId: id
  properties:
    title: title
    description: description
    status: status
    userId: userId
    dueDate: dueDate
    updatedAt: updatedAt
    createdAt: createdAt
    sourceSystem: _source_system

# Constants injected into every staged / mapped row
constants:
  _source_system: RedOnline
