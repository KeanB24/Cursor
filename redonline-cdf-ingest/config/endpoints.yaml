# HSE Compliance (Red Online) REST endpoint catalog
# Source: hse_compliance_api_endpoints.md + samples/rol discovery

base_url: https://apigw.ct-test.hse-compliance.net

auth:
  style: header
  header_name: X-ROL-API-KEY
  api_key: "9f5ef52b-b98d-4cdb-9672-e423cc9051d5"

defaults:
  timeout_seconds: 60
  page_size: 100
  site_id: "112087"
  user_id: "584646"

endpoints:
  list_sites:
    method: GET
    path: /v2/secure-clients/legapi-general/sites
    query: {}
    items_path: sites
    pagination:
      type: none
    fixture: sites.json

  list_users_by_site:
    method: GET
    path: /v2/secure-clients/legapi-general/users/sites/{site_id}
    path_params:
      site_id: "{site_id}"
    query: {}
    items_path: users
    pagination:
      type: none
    fixture: users.json

  list_mapping_references:
    method: GET
    path: /v2/secure-clients/tasks/configs/references
    query:
      user_id: "{user_id}"
    # Whole response object; transform splits data.* into Ref_* tables
    items_path: null
    pagination:
      type: none
    fixture: references.json

  list_tasks_by_user:
    method: GET
    path: /v2/secure-clients/tasks
    query:
      user_id: "{user_id}"
    items_path: data
    pagination:
      type: none
    fixture: tasks.json
